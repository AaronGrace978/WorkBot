[[permission]]
identifier = "workbot-commands"
description = "Commands used by Gemma Work Bot"
commands.allow = [
  "get_settings",
  "save_settings",
  "get_memories",
  "save_memory",
  "delete_memory",
  "clear_learned_memories",
  "get_documents",
  "save_applicant_profile",
  "add_document",
  "update_document_text",
  "delete_document",
  "preview_document",
  "draft_document",
  "attach_document_now",
  "browser_status",
  "launch_chrome",
  "browser_quick_action",
  "run_agent",
  "stop_agent"
]
